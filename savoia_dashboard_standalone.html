const fmtEUR = (n) => new Intl.NumberFormat("en-GB", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(n);
const fmtEUR1 = (n) => new Intl.NumberFormat("en-GB", { style: "currency", currency: "EUR", minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(n);
const fmtEUR2 = (n) => new Intl.NumberFormat("en-GB", { style: "currency", currency: "EUR", maximumFractionDigits: 2 }).format(n);
const fmtNum = (n) => new Intl.NumberFormat("en-GB", { maximumFractionDigits: 0 }).format(n);
const fmtCompact = (n) => new Intl.NumberFormat("en-GB", { notation: "compact" }).format(n);

function Delta({ value, suffix = "%" }) {
  const neutral = Math.abs(value) < 0.05;
  const color = neutral ? "#8C8271" : value > 0 ? "#5B7355" : "#B54B3A";
  const arrow = neutral ? "→" : value > 0 ? "↑" : "↓";
  return (
    <span style={{ color, fontWeight: 600, fontSize: 13 }}>
      {arrow} {value >= 0 ? "+" : ""}{value.toFixed(1)}{suffix}
    </span>
  );
}

function KpiCard({ label, value, sub, delta, deltaLabel, badge, lyValue, absDiff, fmt = fmtEUR }) {
  return (
    <div style={{
      background: "#FFFFFF", border: "1px solid #E4DCC9", borderRadius: 10,
      padding: "18px 20px", minWidth: 0, flex: "1 1 190px",
      boxShadow: "0 1px 2px rgba(30,50,41,0.04)", position: "relative",
    }}>
      {badge && (
        <div style={{ position: "absolute", top: 12, right: 14, fontSize: 9, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: "#A9673C", background: "#F3E9DC", padding: "2px 6px", borderRadius: 4 }}>{badge}</div>
      )}
      <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "#8C8271", fontWeight: 600 }}>{label}</div>
      <div style={{ fontFamily: "'Fraunces', serif", fontSize: 28, color: "#1E3229", marginTop: 6, fontWeight: 600, lineHeight: 1.1 }}>{value}</div>
      {sub && <div style={{ fontSize: 12, color: "#8C8271", marginTop: 4 }}>{sub}</div>}
      {delta !== undefined && (
        <div style={{ marginTop: 8, display: "flex", flexDirection: "column", gap: 2 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <Delta value={delta} />
            <span style={{ fontSize: 12, color: "#B9AFA0" }}>{deltaLabel}</span>
          </div>
          {lyValue !== undefined && (
            <div style={{ fontSize: 11, color: "#B9AFA0" }}>
              {absDiff >= 0 ? "+" : "-"}{fmt(Math.abs(absDiff))} vs LY ({fmt(lyValue)})
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function SectionTitle({ eyebrow, title, note }) {

// Click-to-enlarge chart system.
// Usage: wrap a chart's ResponsiveContainer-returning function as `render(height)`,
// then <ChartCard id="x" title="..." render={render} expanded={expandedChart} onExpand={setExpandedChart} height={220} />
// and once per page: <ChartModal id={expandedChart} registry={chartRegistry} onClose={() => setExpandedChart(null)} />
function ChartCard({ title, subtitle, render, height = 220, onExpand, id }) {
  return (
    <div>
      {title && <div style={{ fontSize: 12, fontWeight: 700, color: "#1E3229", marginBottom: 6 }}>{title}</div>}
      {subtitle && <div style={{ fontSize: 11, color: "#8C8271", marginBottom: 6, marginTop: -4 }}>{subtitle}</div>}
      <div
        onClick={() => onExpand(id)}
        title="Click to enlarge"
        style={{ position: "relative", cursor: "zoom-in" }}
      >
        {render(height)}
        <div style={{
          position: "absolute", top: 2, right: 2, fontSize: 11, color: "#8C8271",
          background: "rgba(255,255,255,0.9)", border: "1px solid #E4DCC9", borderRadius: 6,
          padding: "2px 6px", pointerEvents: "none",
        }}>⤢ enlarge</div>
      </div>
    </div>
  );
}

function ChartModal({ open, title, note, render, onClose }) {
  if (!open) return null;
  return (
    <div
      onClick={onClose}
      style={{
        position: "fixed", inset: 0, background: "rgba(30,50,41,0.6)", zIndex: 1000,
        display: "flex", alignItems: "center", justifyContent: "center", padding: 24,
      }}
    >
      <div
        onClick={(e) => e.stopPropagation()}
        style={{
          background: "#FFFFFF", borderRadius: 12, padding: "26px 30px", width: "100%",
          maxWidth: 920, maxHeight: "88vh", overflowY: "auto", boxShadow: "0 24px 60px rgba(0,0,0,0.35)",
        }}
      >
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 16 }}>
          <div>
            <div style={{ fontFamily: "'Fraunces', serif", fontSize: 20, fontWeight: 600, color: "#1E3229" }}>{title}</div>
            {note && <div style={{ fontSize: 12, color: "#8C8271", marginTop: 3 }}>{note}</div>}
          </div>
          <button
            onClick={onClose}
            style={{ border: "none", background: "#F3EEE3", borderRadius: 8, width: 34, height: 34, cursor: "pointer", fontSize: 16, color: "#1E3229", flexShrink: 0 }}
          >✕</button>
        </div>
        {render(440)}
      </div>
    </div>
  );
}

const W_METRICS = {

};

function w_sum(rows, key) { return rows.reduce((a, r) => a + (r[key] || 0), 0); }
function w_totalsForWeeks(year, weeks) {
  const rows = W_RAW[year].filter((r) => weeks.includes(r.week));
  const inv = w_sum(rows, "inventory");
  const occ = w_sum(rows, "occ_rooms");
  const pkg = w_sum(rows, "pkg_rev");
  const extra = w_sum(rows, "extra_rev");
  const spa = w_sum(rows, "spa_rev");
  const guests = w_sum(rows, "guests");
  const total = pkg + extra;
  return { inv, occ, pkg, extra, spa, guests, total, occPct: inv ? (occ / inv) * 100 : 0, adr: occ ? total / occ : 0, por: occ ? total / occ : 0, pkgPor: occ ? pkg / occ : 0, trevpar: inv ? total / inv : 0, extraPor: occ ? extra / occ : 0 };
}
function w_fbTotalsForWeeks(year, weeks) {
  const data = W_FB_DATA[year];
  if (!data) return { guests: 0, adl: 0, weightedHc: 0, food: 0, foodExtra: 0, bev: 0, spa: 0, foodPerGuest: 0, bevPerAdult: 0, spaPerAdult: 0 };
  let guests = 0, adl = 0, weightedHc = 0, food = 0, foodExtra = 0, bev = 0, spa = 0;
  weeks.forEach((wk) => { const w = data[wk]; if (w) { guests += w.guests; adl += w.adl; weightedHc += w.weighted_hc; food += w.food_rev; foodExtra += w.food_extra; bev += w.bev_rev; spa += w.spa_rev; } });
  return { guests, adl, weightedHc, food, foodExtra, bev, spa, foodPerGuest: weightedHc ? food / weightedHc : 0, bevPerAdult: adl ? bev / adl : 0, spaPerAdult: adl ? spa / adl : 0 };
}
function w_deptForWeeks(year, weeks) {
  const t = w_totalsForWeeks(year, weeks);
  const fb = w_fbTotalsForWeeks(year, weeks);
  const hasDetail = !!W_FB_DATA[year];
  const fnb = hasDetail ? fb.foodExtra + fb.bev : 0;
  const spa = t.spa;
  const other = hasDetail ? Math.max(0, t.extra - fnb - spa) : Math.max(0, t.extra - spa);
  return { pkg: t.pkg, fnb, other, spa, hasDetail };
}

function w_totals(year) {
  const rows = W_RAW[year];
  const inv = w_sum(rows, "inventory");
  const occ = w_sum(rows, "occ_rooms");
  const pkg = w_sum(rows, "pkg_rev");
  const extra = w_sum(rows, "extra_rev");
  const spa = w_sum(rows, "spa_rev");
  const guests = w_sum(rows, "guests");
  const total = pkg + extra;
  return { inv, occ, pkg, extra, spa, guests, total, occPct: (occ / inv) * 100, adr: total / occ, por: total / occ, pkgPor: pkg / occ, trevpar: total / inv, extraPor: extra / occ };
}
function w_fbTotals(year) {
  const weeks = W_FB_DATA[year];
  let guests = 0, adl = 0, weightedHc = 0, food = 0, bev = 0, spa = 0;
  Object.values(weeks).forEach((w) => { guests += w.guests; adl += w.adl; weightedHc += w.weighted_hc; food += w.food_rev; bev += w.bev_rev; spa += w.spa_rev; });
  return { guests, adl, weightedHc, food, bev, spa, foodPerGuest: weightedHc ? food / weightedHc : 0, bevPerAdult: bev / adl, spaPerAdult: spa / adl };
}

    const r26 = getWeekRow("2026", week);

    const bullets = [];

      const dAdr = ((r26.adr / r25.adr) - 1) * 100;
      bullets.push({ tone: dRev >= 0 ? "good" : "bad", text: `Revenue ${fmtEUR(r26.total_rev)} with occupancy ${r26.occ_pct.toFixed(1)}% — ${dRev >= 0 ? "+" : ""}${dRev.toFixed(1)}% revenue and ${dOcc >= 0 ? "+" : ""}${dOcc.toFixed(1)} occupancy points vs 24/25.` });

    } else if (r26) {
      bullets.push({ tone: "neutral", text: `Revenue ${fmtEUR(r26.total_rev)}, occupancy ${r26.occ_pct.toFixed(1)}%. No comparable 24/25 data for this week.` });
    }
    const seasonRows = W_RAW["2026"];
    const sorted = [...seasonRows].sort((a, b) => b.occ_pct - a.occ_pct);
    const rank = sorted.findIndex((r) => r.week === week) + 1;
    bullets.push({ tone: "neutral", text: `This is week #${rank} of ${seasonRows.length} for occupancy this season (25/26).` });
    if (r26 && r24) {

    const fb26 = getWeekFB("2026", week);

    if (fb26 && fb25 && fb26.guests && fb25.guests) {
      const foodPg26 = fb26.food_rev / fb26.weighted_hc;
      const foodPg25 = fb25.food_rev / fb25.weighted_hc;

    if (HOLIDAY_WEEKS.includes(week)) {

const S_METRICS = {
  occ_pct: { label: "Occupancy %", fmt: (v) => `${v.toFixed(0)}%` },
  total_rev: { label: "Weekly Total Revenue", fmt: (v) => fmtEUR(v) },
  adr: { label: "ADR (Avg. Revenue/Room)", fmt: (v) => fmtEUR(v) },
};

function s_sum(rows, key) { return rows.reduce((a, r) => a + (r[key] || 0), 0); }
function s_totalsForWeeks(year, weeks) {
  const rows = S_RAW[year].filter((r) => weeks.includes(r.week));
  const inv = s_sum(rows, "inventory");
  const occ = s_sum(rows, "occ_rooms");
  const pkg = s_sum(rows, "pkg_rev");
  const extra = s_sum(rows, "extra_rev");
  const spa = s_sum(rows, "spa_rev");
  const guests = s_sum(rows, "guests");
  const total = pkg + extra;
  return { inv, occ, pkg, extra, spa, guests, total, occPct: inv ? (occ / inv) * 100 : 0, adr: occ ? total / occ : 0, por: occ ? total / occ : 0, pkgPor: occ ? pkg / occ : 0, trevpar: inv ? total / inv : 0, extraPor: occ ? extra / occ : 0 };
}
function s_fbTotalsForWeeks(year, weeks) {
  const data = S_FB_DATA[year];
  if (!data) return { guests: 0, adl: 0, food: 0, bev: 0, spa: 0, foodPerGuest: 0, bevPerAdult: 0, spaPerAdult: 0 };
  let guests = 0, adl = 0, food = 0, bev = 0, spa = 0;
  weeks.forEach((wk) => { const w = data[wk]; if (w) { guests += w.guests; adl += w.adl; food += w.food_rev; bev += w.bev_rev; spa += w.spa_rev; } });
  return { guests, adl, food, bev, spa, foodPerGuest: guests ? food / guests : 0, bevPerAdult: adl ? bev / adl : 0, spaPerAdult: adl ? spa / adl : 0 };
}
function s_deptForWeeks(year, weeks) {
  const t = s_totalsForWeeks(year, weeks);
  const fb = s_fbTotalsForWeeks(year, weeks);
  const hasDetail = !!S_FB_DATA[year];
  const fnb = hasDetail ? fb.food + fb.bev : 0;
  const spa = t.spa;
  const other = hasDetail ? Math.max(0, t.extra - fnb - spa) : Math.max(0, t.extra - spa);
  return { pkg: t.pkg, fnb, other, spa, hasDetail };
}

function s_totals(year) {
  const rows = S_RAW[year];
  const inv = s_sum(rows, "inventory");
  const occ = s_sum(rows, "occ_rooms");
  const pkg = s_sum(rows, "pkg_rev");
  const extra = s_sum(rows, "extra_rev");
  const spa = s_sum(rows, "spa_rev");
  const guests = s_sum(rows, "guests");
  const total = pkg + extra;
  return { inv, occ, pkg, extra, spa, guests, total, occPct: (occ / inv) * 100, adr: total / occ, por: total / occ, pkgPor: pkg / occ, trevpar: total / inv, extraPor: extra / occ };
}
function s_fbTotals(year) {
  const weeks = S_FB_DATA[year];
  let guests = 0, adl = 0, food = 0, bev = 0, spa = 0;
  Object.values(weeks).forEach((w) => { guests += w.guests; adl += w.adl; food += w.food_rev; bev += w.bev_rev; spa += w.spa_rev; });
  return { guests, adl, food, bev, spa, foodPerGuest: food / guests, bevPerAdult: bev / adl, spaPerAdult: spa / adl };
}

const A_ANNUAL_METRICS = {
  occPct: { label: "Occupancy %", fmt: (v) => `${v.toFixed(1)}%` },
  adr: { label: "ADR", fmt: (v) => fmtEUR(v) },
  revpar: { label: "RevPAR", fmt: (v) => fmtEUR(v) },
  trevpar: { label: "TrevPAR", fmt: (v) => fmtEUR(v) },
  totalRevenue: { label: "Total Revenue", fmt: (v) => fmtEUR(v) },
};

function AnnualPage() {
  const [view, setView] = useState("overview");
  const [metric, setMetric] = useState("occPct");
  const [expandedChart, setExpandedChart] = useState(null);

  const a26 = A_DATA["2026"].ANNUAL, a25 = A_DATA["2025"].ANNUAL;
  const w26 = A_DATA["2026"].WINTER, w25 = A_DATA["2025"].WINTER;

  const occDeltaWinter = w26.occPct - w25.occPct;
  const adrDeltaWinter = ((w26.adr / w25.adr) - 1) * 100;
  const revparDeltaWinter = ((w26.revpar / w25.revpar) - 1) * 100;
  const revDeltaWinter = ((w26.totalRevenue / w25.totalRevenue) - 1) * 100;
  // Genuine YTD comparison, aligned by week number (not calendar date) since the resort's
  // reporting weeks always run Sunday-to-Sunday. 25/26 YTD = Winter 25/26 (complete) + Summer 2026
  // weeks 23-32 (through 8 Aug 2026). 24/25 YTD-equivalent = Winter 24/25 (complete) + Summer 2025
  // weeks 23-32 only (through the same week 32, ~9 Aug 2025) — NOT the full 2025 summer.
  const s25ytd = S_RAW["2025"].reduce((acc, r) => ({
    total: acc.total + r.total_rev, pkg: acc.pkg + r.pkg_rev, extra: acc.extra + r.extra_rev,
    occ: acc.occ + r.occ_rooms, inv: acc.inv + r.inventory,
  }), { total: 0, pkg: 0, extra: 0, occ: 0, inv: 0 });

  const ytd2025Total = w25.totalRevenue + s25ytd.total;
  const ytdDeltaVs25 = ((a26.totalRevenue / ytd2025Total) - 1) * 100;

  const ytd2025Pkg = w25.totalRoomsPkg + s25ytd.pkg;
  const pkgTotalDeltaVs25 = ytd2025Pkg ? ((a26.totalRoomsPkg / ytd2025Pkg) - 1) * 100 : 0;

  const ytd2025Extra = w25.extra + s25ytd.extra;
  const extraTotalDeltaVs25 = ytd2025Extra ? ((a26.extra / ytd2025Extra) - 1) * 100 : 0;

  const ytd2025OccRooms = w25.occRooms + s25ytd.occ;
  const ytd2025Inventory = w25.inventory + s25ytd.inv;
  const ytd2025Trevpar = ytd2025Inventory ? ytd2025Total / ytd2025Inventory : 0;
  const ytd2025Trevpor = ytd2025OccRooms ? ytd2025Total / ytd2025OccRooms : 0;
  const ytd2025PkgPor = ytd2025OccRooms ? ytd2025Pkg / ytd2025OccRooms : 0;
  const ytd2025ExtraPor = ytd2025OccRooms ? ytd2025Extra / ytd2025OccRooms : 0;

  const a26PkgPor = a26.occRooms ? a26.totalRoomsPkg / a26.occRooms : 0;
  const a26ExtraPor = a26.occRooms ? a26.extra / a26.occRooms : 0;
  const pkgPorDeltaVs25 = ytd2025PkgPor ? ((a26PkgPor / ytd2025PkgPor) - 1) * 100 : 0;
  const extraPorDeltaVs25 = ytd2025ExtraPor ? ((a26ExtraPor / ytd2025ExtraPor) - 1) * 100 : 0;
  const trevparDeltaVs25 = ytd2025Trevpar ? ((a26.trevpar / ytd2025Trevpar) - 1) * 100 : 0;
  const trevporDeltaVs25 = ytd2025Trevpor ? ((a26.trevpor / ytd2025Trevpor) - 1) * 100 : 0;

  const trendData = A_FY.map((y) => {
    const d = A_DATA[y].ANNUAL;
    return { fy: A_FY_LABEL[y], occPct: d.occPct, adr: d.adr, revpar: d.revpar, trevpar: d.trevpar, totalRevenue: d.totalRevenue };
  });

  const seasonSplitData = A_FY.map((y) => ({ fy: A_FY_LABEL[y], Winter: A_DATA[y].WINTER.totalRevenue, Summer: A_DATA[y].SUMMER.totalRevenue }));

  const revenueCompositionData = A_FY.map((y) => {
    const d = A_DATA[y].ANNUAL;
    return { fy: A_FY_LABEL[y], "Rooms Revenue": d.roomsRevenue, "Package Allocation": d.pkgAllocation, "F&B Revenue": d.fnb, "Other Op. Depts.": d.ood, "Spa Revenue": d.spa };
  });

  const renderTrend = (h) => (
    <ResponsiveContainer width="100%" height={h}>
      <LineChart data={trendData} margin={{ top: 10, right: 20, left: 0, bottom: 0 }}>
        <CartesianGrid stroke="#EDE6D6" vertical={false} />
        <XAxis dataKey="fy" tick={{ fontSize: 12, fill: "#8C8271" }} axisLine={{ stroke: "#DDD2B8" }} tickLine={false} />
        <YAxis tick={{ fontSize: 12, fill: "#8C8271" }} axisLine={false} tickLine={false} tickFormatter={(v) => metric === "occPct" ? `${v}%` : fmtCompact(v)} />
        <Tooltip contentStyle={{ background: "#1E3229", border: "none", borderRadius: 8, color: "#F3EEE3" }} labelStyle={{ color: "#C9A876", fontWeight: 700 }} formatter={(v) => A_ANNUAL_METRICS[metric].fmt(v)} />
        <Line type="monotone" dataKey={metric} stroke="#A9673C" strokeWidth={3} dot={{ r: 5 }} />
      </LineChart>
    </ResponsiveContainer>
  );

  const renderComposition = (h) => (
    <ResponsiveContainer width="100%" height={h}>
      <BarChart data={revenueCompositionData} margin={{ top: 10, right: 20, left: 0, bottom: 0 }}>
        <CartesianGrid stroke="#EDE6D6" vertical={false} />
        <XAxis dataKey="fy" tick={{ fontSize: 12, fill: "#8C8271" }} axisLine={{ stroke: "#DDD2B8" }} tickLine={false} />
        <YAxis tick={{ fontSize: 12, fill: "#8C8271" }} axisLine={false} tickLine={false} tickFormatter={fmtCompact} />
        <Tooltip contentStyle={{ background: "#1E3229", border: "none", borderRadius: 8, color: "#F3EEE3" }} labelStyle={{ color: "#C9A876", fontWeight: 700 }} formatter={(v) => fmtEUR(v)} />
        <Legend wrapperStyle={{ fontSize: 12 }} />
        <Bar dataKey="Rooms Revenue" stackId="a" fill="#1E3229" />
        <Bar dataKey="Package Allocation" stackId="a" fill="#5B7355" />
        <Bar dataKey="F&B Revenue" stackId="a" fill="#A9673C" />
        <Bar dataKey="Other Op. Depts." stackId="a" fill="#C9A876" />
        <Bar dataKey="Spa Revenue" stackId="a" fill="#D8B79A" radius={[3, 3, 0, 0]} />
      </BarChart>
    </ResponsiveContainer>
  );

  const renderSeasonSplit = (h) => (
    <ResponsiveContainer width="100%" height={h}>
      <BarChart data={seasonSplitData} margin={{ top: 10, right: 20, left: 0, bottom: 0 }}>
        <CartesianGrid stroke="#EDE6D6" vertical={false} />
        <XAxis dataKey="fy" tick={{ fontSize: 12, fill: "#8C8271" }} axisLine={{ stroke: "#DDD2B8" }} tickLine={false} />
        <YAxis tick={{ fontSize: 12, fill: "#8C8271" }} axisLine={false} tickLine={false} tickFormatter={fmtCompact} />
        <Tooltip contentStyle={{ background: "#1E3229", border: "none", borderRadius: 8, color: "#F3EEE3" }} labelStyle={{ color: "#C9A876", fontWeight: 700 }} formatter={(v) => fmtEUR(v)} />
        <Legend wrapperStyle={{ fontSize: 12 }} />
        <Bar dataKey="Winter" stackId="a" fill="#1E3229" />
        <Bar dataKey="Summer" stackId="a" fill="#A9673C" radius={[3, 3, 0, 0]} />
      </BarChart>
    </ResponsiveContainer>
  );

  const CHART_META = {
    trend: { title: "Four-Year Comparison", note: "22/23 → 25/26", render: renderTrend },
    composition: { title: "Annual Revenue by Source", note: "22/23 → 25/26", render: renderComposition },
    season: { title: "Winter vs Summer Revenue Share", note: "By fiscal year", render: renderSeasonSplit },
  };

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", flexWrap: "wrap", gap: 16, marginBottom: 20 }}>
        <div>
          <div style={{ fontFamily: "'Fraunces', serif", fontSize: 26, color: "#1E3229", fontWeight: 600 }}>Annual Overview</div>
          <div style={{ fontSize: 13, color: "#8C8271", marginTop: 4 }}>Our Year: 1 November – 31 October · comparison 22/23 → 25/26</div>
        </div>
        <div style={{ textAlign: "right" }}>
          <div style={{ fontSize: 11, color: "#8C8271", textTransform: "uppercase", letterSpacing: "0.08em" }}>25/26 Total Revenue to Date</div>
          <div style={{ fontFamily: "'Fraunces', serif", fontSize: 22, color: "#1E3229", fontWeight: 600 }}>{fmtEUR(a26.totalRevenue)}</div>
          <Delta value={ytdDeltaVs25} /><span style={{ fontSize: 12, color: "#B9AFA0", marginLeft: 6 }}>YTD vs 24/25 (1 Nov–8 Aug, both years)</span>
        </div>
      </div>

      <div style={{ background: "#F3E4DC", border: "1px solid #E3C6B7", borderRadius: 10, padding: "14px 18px", marginBottom: 24, fontSize: 13, color: "#5A4436", lineHeight: 1.6 }}>
        <strong>Year 25/26 is in progress.</strong> Winter 25/26 is complete and fully comparable year-on-year. Summer 2026 is season-to-date through 8 August and no autumn 2026 data is yet included. Treat 25/26 ANNUAL figures as a running total — the Winter-only figures below are the reliable like-for-like read.
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 28 }}>
        <button onClick={() => setView("overview")} style={{ fontFamily: "inherit", fontSize: 13, fontWeight: 700, padding: "9px 18px", borderRadius: 8, border: "1px solid " + (view === "overview" ? "#1E3229" : "#DDD2B8"), background: view === "overview" ? "#1E3229" : "#FFFFFF", color: view === "overview" ? "#F3EEE3" : "#5B5646", cursor: "pointer" }}>Year Overview</button>
        <button onClick={() => setView("season")} style={{ fontFamily: "inherit", fontSize: 13, fontWeight: 700, padding: "9px 18px", borderRadius: 8, border: "1px solid " + (view === "season" ? "#1E3229" : "#DDD2B8"), background: view === "season" ? "#1E3229" : "#FFFFFF", color: view === "season" ? "#F3EEE3" : "#5B5646", cursor: "pointer" }}>Winter vs Summer Breakdown</button>
      </div>

      {view === "overview" && (<>
        <div style={{ fontSize: 12, fontWeight: 700, color: "#A9673C", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 10 }}>25/26 Year-to-Date (Winter + Summer combined, in progress)</div>
        <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 16 }}>
          <KpiCard label="Occupancy % (avg)" value={`${a26.occPct.toFixed(1)}%`} sub="weighted across operating weeks to date" delta={a26.occPct - a25.occPct} deltaLabel="pt YTD vs 24/25" badge="Running" />
          <KpiCard label="Total Revenue" value={fmtEUR(a26.totalRevenue)} sub="1 Nov 2025 – 8 Aug 2026" delta={ytdDeltaVs25} deltaLabel="YTD vs 24/25" lyValue={ytd2025Total} absDiff={a26.totalRevenue - ytd2025Total} badge="Running" />
          <KpiCard label="PKG Revenue" value={fmtEUR(a26.totalRoomsPkg)} sub="rooms + board" delta={pkgTotalDeltaVs25} deltaLabel="YTD vs 24/25" lyValue={ytd2025Pkg} absDiff={a26.totalRoomsPkg - ytd2025Pkg} badge="Running" />
          <KpiCard label="Extra Revenue" value={fmtEUR(a26.extra)} sub="F&B, other depts., spa" delta={extraTotalDeltaVs25} deltaLabel="YTD vs 24/25" lyValue={ytd2025Extra} absDiff={a26.extra - ytd2025Extra} badge="Running" />
          <KpiCard label="TrevPAR" value={fmtEUR1(a26.trevpar)} sub="total revenue per available room" delta={trevparDeltaVs25} deltaLabel="YTD vs 24/25" lyValue={ytd2025Trevpar} absDiff={a26.trevpar - ytd2025Trevpar} fmt={fmtEUR1} badge="Running" />
          <KpiCard label="TrevPOR" value={fmtEUR1(a26.trevpor)} sub="total revenue per occupied room" delta={trevporDeltaVs25} deltaLabel="YTD vs 24/25" lyValue={ytd2025Trevpor} absDiff={a26.trevpor - ytd2025Trevpor} fmt={fmtEUR1} badge="Running" />
          <KpiCard label="PKG's POR" value={fmtEUR1(a26PkgPor)} sub="PKG revenue per occupied room" delta={pkgPorDeltaVs25} deltaLabel="YTD vs 24/25" lyValue={ytd2025PkgPor} absDiff={a26PkgPor - ytd2025PkgPor} fmt={fmtEUR1} badge="Running" />
          <KpiCard label="Extra POR" value={fmtEUR1(a26ExtraPor)} sub="extra revenue (incl. spa) per occupied room" delta={extraPorDeltaVs25} deltaLabel="YTD vs 24/25" lyValue={ytd2025ExtraPor} absDiff={a26ExtraPor - ytd2025ExtraPor} fmt={fmtEUR1} badge="Running" />
        </div>
        <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 28 }}>
          <KpiCard label="Guests in House (GIH)" value={fmtNum(a26.guestInHouse)} sub="season-to-date presences" badge="Running" />
        </div>

        <div style={{ fontSize: 12, fontWeight: 700, color: "#5B7355", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 10 }}>For Reference — Winter-Only Like-for-Like (25/26 vs 24/25, both fully closed)</div>
        <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 36 }}>
          <KpiCard label="Winter Occupancy %" value={`${w26.occPct.toFixed(1)}%`} delta={occDeltaWinter} deltaLabel="pt YoY" />
          <KpiCard label="Winter ADR" value={fmtEUR(w26.adr)} delta={adrDeltaWinter} deltaLabel="YoY" />
          <KpiCard label="Winter RevPAR" value={fmtEUR(w26.revpar)} delta={revparDeltaWinter} deltaLabel="YoY" />
          <KpiCard label="Winter Total Revenue" value={fmtEUR(w26.totalRevenue)} delta={revDeltaWinter} deltaLabel="YoY" />
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 40 }}>
          <div style={{ background: "#EFE6D3", border: "1px solid #DDCFAE", borderRadius: 10, padding: "20px 22px" }}>
            <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "#5B7355", fontWeight: 700 }}>✓ Where Performance Is Strongest</div>
            <ul style={{ margin: "10px 0 0", paddingLeft: 18, fontSize: 14, lineHeight: 1.7, color: "#3A362E" }}>
              <li>Four-year occupancy trend is consistently positive: 22/23 62.8% → 23/24 62.0% → 24/25 63.7% → <strong>25/26 running at 66.7%</strong>.</li>
              <li>ADR has grown every year, holding 24/25's step-change in rate: €121.18 running (25/26).</li>
              <li>Winter 25/26 is unambiguously strong: occupancy {w26.occPct.toFixed(1)}% (<Delta value={occDeltaWinter} suffix=" pt" />), ADR {fmtEUR(w26.adr)} (<Delta value={adrDeltaWinter} />), RevPAR {fmtEUR(w26.revpar)} (<Delta value={revparDeltaWinter} />).</li>
              <li>Year-to-date revenue (1 Nov 2025 – 8 Aug 2026) is <Delta value={ytdDeltaVs25} /> vs the same weeks last year (1 Nov 2024 – week 32 2025) — a genuine like-for-like comparison, not just partial-vs-full-year.</li>
            </ul>
          </div>
          <div style={{ background: "#F3E4DC", border: "1px solid #E3C6B7", borderRadius: 10, padding: "20px 22px" }}>
            <div style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "#B54B3A", fontWeight: 700 }}>⚠ Where To Focus Attention</div>
            <ul style={{ margin: "10px 0 0", paddingLeft: 18, fontSize: 14, lineHeight: 1.7, color: "#3A362E" }}>
              <li>Average Length of Stay running at 4.25 nights in 25/26 is inflated by the short, partial summer sample — not a genuine stay-length trend until the season closes.</li>
              <li>Spa revenue dipped -13.7% in 25/26 summer-to-date even as Winter 25/26 spa grew +49.7% — worth reconciling.</li>
              <li>Other Operated Departments revenue fell from €114,794 (22/23) to €77,883-€86,014 (23/24-24/25) — a structural step down.</li>
              <li>Avoid extrapolating 25/26 annual totals from mid-season figures until September-October 2026 are captured.</li>
            </ul>
          </div>
        </div>

        <div style={{ background: "#FFFFFF", border: "1px solid #E4DCC9", borderRadius: 10, padding: "24px 26px", marginBottom: 28 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 12, marginBottom: 8 }}>
            <SectionTitle eyebrow="Annual Trend" title="Four-Year Comparison" note="22/23 → 25/26 — click to enlarge" />
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {Object.entries(A_ANNUAL_METRICS).map(([key, m]) => (<button key={key} onClick={() => setMetric(key)} style={{ fontFamily: "inherit", fontSize: 12, fontWeight: 600, padding: "7px 12px", borderRadius: 20, border: "1px solid " + (metric === key ? "#1E3229" : "#DDD2B8"), background: metric === key ? "#1E3229" : "transparent", color: metric === key ? "#F3EEE3" : "#5B5646", cursor: "pointer" }}>{m.label}</button>))}
            </div>
          </div>
          <ChartCard id="trend" render={renderTrend} height={300} onExpand={setExpandedChart} />
        </div>

        <div style={{ background: "#FFFFFF", border: "1px solid #E4DCC9", borderRadius: 10, padding: "24px 26px", marginBottom: 28 }}>
          <SectionTitle eyebrow="Revenue Composition" title="Annual Revenue by Source, 22/23 → 25/26" note="Click to enlarge" />
          <ChartCard id="composition" render={renderComposition} height={300} onExpand={setExpandedChart} />
        </div>

        <div style={{ background: "#FFFFFF", border: "1px solid #E4DCC9", borderRadius: 10, padding: "24px 26px" }}>
          <SectionTitle eyebrow="Detail" title="Full Annual KPI Comparison" note="USALI-aligned metrics, 22/23 → 25/26" />
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
              <thead><tr style={{ borderBottom: "2px solid #E4DCC9" }}>
                <th style={{ textAlign: "left", padding: "8px 10px", color: "#8C8271", fontWeight: 600, fontSize: 11, textTransform: "uppercase" }}>Metric</th>
                {A_FY.map((y) => (<th key={y} style={{ textAlign: "right", padding: "8px 10px", color: y === "2026" ? "#1E3229" : "#8C8271", fontWeight: y === "2026" ? 700 : 600, fontSize: 11, textTransform: "uppercase" }}>{A_FY_LABEL[y]}</th>))}
              </tr></thead>
              <tbody>
                {[
                  ["Operating Days", (d) => fmtNum(d.days)],
                  ["Available Rooms (Inventory)", (d) => fmtNum(d.inventory)],
                  ["Rooms Sold", (d) => fmtNum(d.occRooms)],
                  ["Occupancy %", (d) => `${d.occPct.toFixed(1)}%`],
                  ["Guests in House (GIH)", (d) => fmtNum(d.guestInHouse)],
                  ["Average Length of Stay", (d) => `${d.alos.toFixed(2)} nights`],
                  ["Double Occupancy", (d) => d.dblOcc.toFixed(2)],
                  ["ADR", (d) => fmtEUR2(d.adr)],
                  ["RevPAR", (d) => fmtEUR2(d.revpar)],
                  ["TrevPAR", (d) => fmtEUR2(d.trevpar)],
                  ["TrevPOR (Revenue POR)", (d) => fmtEUR2(d.trevpor)],
                  ["Rooms Revenue", (d) => fmtEUR(d.roomsRevenue)],
                  ["Package Allocation", (d) => fmtEUR(d.pkgAllocation)],
                  ["Total Rooms & Package Revenue", (d) => fmtEUR(d.totalRoomsPkg)],
                  ["F&B Revenue", (d) => fmtEUR(d.fnb)],
                  ["Other Operated Depts. Revenue", (d) => fmtEUR(d.ood)],
                  ["Spa Revenue", (d) => fmtEUR(d.spa)],
                  ["Total Extra Revenue", (d) => fmtEUR(d.extra)],
                  ["Total Revenue", (d) => fmtEUR(d.totalRevenue)],
                ].map(([label, fmt]) => (
                  <tr key={label} style={{ borderBottom: "1px solid #F0EAD9" }}>
                    <td style={{ padding: "8px 10px", fontWeight: 600, color: "#1E3229" }}>{label}</td>
                    {A_FY.map((y) => (<td key={y} style={{ padding: "8px 10px", textAlign: "right", fontWeight: y === "2026" ? 700 : 400 }}>{fmt(A_DATA[y].ANNUAL)}</td>))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </>)}

      {view === "season" && (<>
        <div style={{ background: "#FFFFFF", border: "1px solid #E4DCC9", borderRadius: 10, padding: "24px 26px", marginBottom: 28 }}>
          <SectionTitle eyebrow="Season Contribution" title="Winter vs Summer Revenue Share by Year" note="Click to enlarge" />
          <ChartCard id="season" render={renderSeasonSplit} height={300} onExpand={setExpandedChart} />
        </div>

        <div style={{ background: "#FFFFFF", border: "1px solid #E4DCC9", borderRadius: 10, padding: "24px 26px" }}>
          <SectionTitle eyebrow="Detail" title="Winter and Summer KPIs, Side by Side" />
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
              <thead><tr style={{ borderBottom: "2px solid #E4DCC9" }}>
                <th style={{ textAlign: "left", padding: "8px 10px", color: "#8C8271", fontWeight: 600, fontSize: 11, textTransform: "uppercase" }}>Metric</th>
                {A_FY.flatMap((y) => [
                  <th key={y + "W"} style={{ textAlign: "right", padding: "8px 10px", color: y === "2026" ? "#1E3229" : "#8C8271", fontWeight: y === "2026" ? 700 : 600, fontSize: 11, textTransform: "uppercase" }}>{A_FY_LABEL[y]} Win</th>,
                  <th key={y + "S"} style={{ textAlign: "right", padding: "8px 10px", color: y === "2026" ? "#1E3229" : "#8C8271", fontWeight: y === "2026" ? 700 : 600, fontSize: 11, textTransform: "uppercase" }}>{A_FY_LABEL[y]} Sum</th>,
                ])}
              </tr></thead>
              <tbody>
                {[
                  ["Occupancy %", (d) => `${d.occPct.toFixed(1)}%`],
                  ["ADR", (d) => fmtEUR2(d.adr)],
                  ["RevPAR", (d) => fmtEUR2(d.revpar)],
                  ["TrevPAR", (d) => fmtEUR2(d.trevpar)],
                  ["Guests in House (GIH)", (d) => fmtNum(d.guestInHouse)],
                  ["Total Revenue", (d) => fmtEUR(d.totalRevenue)],
                ].map(([label, fmt]) => (
                  <tr key={label} style={{ borderBottom: "1px solid #F0EAD9" }}>
                    <td style={{ padding: "8px 10px", fontWeight: 600, color: "#1E3229" }}>{label}</td>
                    {A_FY.flatMap((y) => [
                      <td key={y + "W"} style={{ padding: "8px 10px", textAlign: "right", fontWeight: y === "2026" ? 700 : 400 }}>{fmt(A_DATA[y].WINTER)}</td>,
                      <td key={y + "S"} style={{ padding: "8px 10px", textAlign: "right", fontWeight: y === "2026" ? 700 : 400 }}>{fmt(A_DATA[y].SUMMER)}</td>,
                    ])}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </>)}

      <ChartModal
        open={!!expandedChart}
        title={expandedChart ? CHART_META[expandedChart].title : ""}
        note={expandedChart ? CHART_META[expandedChart].note : ""}
        render={expandedChart ? CHART_META[expandedChart].render : () => null}
        onClose={() => setExpandedChart(null)}
      />
    </div>
  );
}

// =============================================================================
// TOP-LEVEL APP — Annual / Winter / Summer navigation
// =============================================================================

function SavoiaResortDashboard() {
  const [section, setSection] = useState("annual");

  const SECTION_LABEL = { annual: "Annual", winter: "Winter", summer: "Summer" };
  const SECTION_SUBTITLE = {
    annual: "Our Year: Nov–Oct",
    winter: "Winter Season 25/26",
    summer: "Summer Season 2026",
  };

  return (
    <div style={{ fontFamily: "'Inter', -apple-system, sans-serif", background: "#F3EEE3", minHeight: "100%", padding: 0, color: "#262420" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; }
      `}</style>

      {/* SHARED HEADER */}
      <div style={{ background: "#1E3229", padding: "32px 32px 28px", position: "relative", overflow: "hidden" }}>
        <svg style={{ position: "absolute", bottom: 0, left: 0, width: "100%", height: 50, opacity: 0.3 }} viewBox="0 0 1200 50" preserveAspectRatio="none">
          <polygon points="0,50 0,30 150,12 300,40 450,8 600,32 750,15 900,42 1050,12 1200,30 1200,50" fill="#C9A876" />
        </svg>
        <div style={{ position: "relative" }}>
          <div style={{ fontSize: 11, letterSpacing: "0.15em", textTransform: "uppercase", color: "#C9A876", fontWeight: 700 }}>Savoia Mountain Resort · Bardonecchia</div>
          <div style={{ fontFamily: "'Fraunces', serif", fontSize: 30, color: "#F3EEE3", fontWeight: 600, marginTop: 6 }}>Sales Report Dashboard</div>
          <div style={{ fontSize: 13, color: "#B9AFA0", marginTop: 4 }}>{SECTION_SUBTITLE[section]}</div>

          {/* SECTION NAV */}
          <div style={{ display: "flex", gap: 8, marginTop: 20 }}>
            {["annual", "winter", "summer"].map((s) => (
              <button
                key={s}
                onClick={() => setSection(s)}
                style={{
                  fontFamily: "inherit", fontSize: 13, fontWeight: 700, padding: "10px 22px",
                  borderRadius: 8, border: "1px solid " + (section === s ? "#C9A876" : "rgba(243,238,227,0.25)"),
                  background: section === s ? "#C9A876" : "rgba(243,238,227,0.08)",
                  color: section === s ? "#1E3229" : "#F3EEE3", cursor: "pointer",
                }}
              >{SECTION_LABEL[s]}</button>
            ))}
          </div>
        </div>
      </div>

      <div style={{ padding: "28px 32px 48px", maxWidth: 1180, margin: "0 auto" }}>
        {section === "annual" && <AnnualPage />}
        {section === "winter" && <WinterPage />}
        {section === "summer" && <SummerPage />}

        <div style={{ marginTop: 24, fontSize: 12, color: "#B9AFA0", textAlign: "center", lineHeight: 1.6 }}>
          Data extracted from SALES_CMPRSN_summer_26_fino_al_8_aug.xlsx (sheets "KPI's", "winter 26", "summer 26"). Our year runs 1 November – 31 October.<br />
          "Food" and "Beverage" per-capita figures capture only à la carte / extra outlet revenue (Stellato + Volpe), not meals already included in the room+board package — verified directly against source cells.
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<SavoiaResortDashboard />);
</script>
</body>
